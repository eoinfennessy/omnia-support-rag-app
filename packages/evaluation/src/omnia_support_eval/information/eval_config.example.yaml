# Evaluation pipeline configuration
# CLI arguments override any values set here.

# Data paths
gold_set: packages/evaluation/gold_set.json
dataset: dataset/omnia_retail_knowledge_base.json

# Prompt settings
prompt_name: omnia_support_system
# prompt_version: 3          # Use a specific version (mutually exclusive with prompt_alias)
prompt_alias: production

# Query interpretation prompt
interpret_query_prompt_name: interpret_query
interpret_query_prompt_alias: production

# Model settings
model: gpt-5.4-mini
embedding_model: text-embedding-3-small

# Retrieval
retrieval_mode: hybrid       # semantic | bm25 | hybrid
n_results: 8

# Filter thresholds
cosine_threshold: 0.23
bm25_threshold: 1.5

# Hybrid RRF fusion weights
semantic_weight: 0.6
bm25_weight: 0.4

# Infrastructure
chroma_host: localhost
chroma_port: 8000
bm25_path: data/bm25

# MLflow
experiment_name: omnia-support-eval
