[project]
name = "omnia-support-rag"
version = "0.1.0"
description = "RAG pipeline for Omnia Support"
requires-python = ">=3.14"
dependencies = [
    "omnia-support-store",
    "jinja2>=3.1.6",
    "mlflow>=3.11.1",
    "tiktoken>=0.9.0",
]

[tool.uv.sources]
omnia-support-store = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
