services:
  chromadb:
    image: chromadb/chroma:1.5.8
    ports:
      - "8000:8000"
    volumes:
      - ./data/chroma:/data
    healthcheck:
      test: ["CMD", "bash", "-c", "echo -e 'GET /api/v2/healthcheck HTTP/1.1\r\nHost: localhost\r\n\r\n' > /dev/tcp/localhost/8000"]
      interval: 5s
      timeout: 3s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.11.1
    ports:
      - "5000:5000"
    volumes:
      - ./data/mlflow:/mlflow
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow/mlflow.db --default-artifact-root /mlflow/artifacts --allowed-hosts localhost,localhost:5000,mlflow,mlflow:5000
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  ingestion:
    build:
      context: .
      dockerfile: packages/ingestion/Dockerfile
    env_file: ${ENV_FILE:-.env}
    environment:
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      FORCE_INGESTION: "${FORCE_INGESTION:-false}"
      BM25_INDEX_PATH: /data/bm25
    volumes:
      - ./data:/data
    depends_on:
      chromadb:
        condition: service_healthy

  mcp-server:
    build:
      context: .
      dockerfile: packages/mcp-server/Dockerfile
    ports:
      - "8081:8081"
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8081"

  app:
    build:
      context: .
      dockerfile: packages/app/Dockerfile
    ports:
      - "8080:8080"
    env_file: ${ENV_FILE:-.env}
    environment:
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      MLFLOW_TRACKING_URI: http://mlflow:5000
      RETRIEVAL_MODE: "${RETRIEVAL_MODE:-hybrid}"
      BM25_INDEX_PATH: /data/bm25
      MCP_SERVER_URL: http://mcp-server:8081/mcp
    volumes:
      - ./data:/data
    depends_on:
      chromadb:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      ingestion:
        condition: service_completed_successfully
      register-prompt:
        condition: service_completed_successfully
      mcp-server:
        condition: service_started
    profiles:
      - app

  register-prompt:
    build:
      context: .
      dockerfile: packages/evaluation/Dockerfile
    entrypoint: ["sh", "-c"]
    command:
      - |
        uv run --no-sync --package omnia-support-eval register-prompt --prompt-path prompts/omnia_support_system.yaml --prompt-name omnia_support_system &&
        uv run --no-sync --package omnia-support-eval register-prompt --prompt-path prompts/interpret_query.yaml --prompt-name interpret_query &&
        uv run --no-sync --package omnia-support-eval register-prompt --prompt-path prompts/triage.yaml --prompt-name triage &&
        uv run --no-sync --package omnia-support-eval register-prompt --prompt-path prompts/action.yaml --prompt-name action &&
        uv run --no-sync --package omnia-support-eval register-prompt --prompt-path prompts/aggregate.yaml --prompt-name aggregate
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      mlflow:
        condition: service_healthy

  evaluation-information:
    build:
      context: .
      dockerfile: packages/evaluation/Dockerfile
    command: ["evaluate", "information", "--config", "eval_config.yaml"]
    env_file: ${ENV_FILE:-.env}
    environment:
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      MLFLOW_TRACKING_URI: http://mlflow:5000
      BM25_INDEX_PATH: /data/bm25
    volumes:
      - ./data:/data
    depends_on:
      chromadb:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      register-prompt:
        condition: service_completed_successfully
    profiles:
      - eval

  evaluation-triage:
    build:
      context: .
      dockerfile: packages/evaluation/Dockerfile
    command: ["evaluate", "triage"]
    env_file: ${ENV_FILE:-.env}
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      mlflow:
        condition: service_healthy
      register-prompt:
        condition: service_completed_successfully
    profiles:
      - eval

  evaluation-action:
    build:
      context: .
      dockerfile: packages/evaluation/Dockerfile
    command: ["evaluate", "action", "--mcp-server-url", "http://mcp-server:8081/sse"]
    env_file: ${ENV_FILE:-.env}
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      mlflow:
        condition: service_healthy
      mcp-server:
        condition: service_started
      register-prompt:
        condition: service_completed_successfully
    profiles:
      - eval

  evaluation-aggregator:
    build:
      context: .
      dockerfile: packages/evaluation/Dockerfile
    command: ["evaluate", "aggregator"]
    env_file: ${ENV_FILE:-.env}
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      mlflow:
        condition: service_healthy
      register-prompt:
        condition: service_completed_successfully
    profiles:
      - eval
